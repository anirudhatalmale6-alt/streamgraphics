<!-- ============================================================================
     StreamGraphics Pro — download buttons
     Paste this whole block into the page where the download should appear.
     Self-contained: no jQuery, no framework, nothing to load.

     THE ONLY LINES YOU MIGHT CHANGE are the three URLs in SGP_FILES just below.
     The Windows one is already your live URL. The two Mac ones are the names I
     would suggest you upload the signed builds as — if you name them something
     else, change those two strings to match and nothing else.

     What it does: shows the visitor the download for the computer they are on,
     with the others still visible underneath. Nobody has to know what they are
     running, and nobody is prevented from taking a different one.
     ============================================================================ -->

<div id="sgp-downloads" class="sgp-dl">
  <div class="sgp-dl-main">
    <a class="sgp-dl-btn" id="sgp-dl-primary" href="#"><span class="sgp-dl-ico" id="sgp-dl-ico"></span><span><b id="sgp-dl-title">Download StreamGraphics Pro</b><small id="sgp-dl-sub">Choose your version below</small></span></a>
  </div>
  <p class="sgp-dl-alt" id="sgp-dl-alt"></p>
  <p class="sgp-dl-help" id="sgp-dl-help"></p>
</div>

<style>
/* Scoped to .sgp-dl so nothing here can reach the rest of your page. */
.sgp-dl{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:560px;margin:28px auto;text-align:center}
.sgp-dl-main{display:flex;justify-content:center}
.sgp-dl-btn{display:inline-flex;align-items:center;gap:14px;text-decoration:none;background:#12b886;color:#04231a;
  padding:16px 26px;border-radius:12px;box-shadow:0 6px 18px rgba(18,184,134,.28);transition:transform .12s ease,box-shadow .12s ease}
.sgp-dl-btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(18,184,134,.36)}
.sgp-dl-btn b{display:block;font-size:17px;font-weight:800;letter-spacing:.2px}
.sgp-dl-btn small{display:block;font-size:13px;font-weight:600;opacity:.75;margin-top:2px}
.sgp-dl-ico{width:26px;height:26px;flex:0 0 26px;display:block}
.sgp-dl-ico svg{width:100%;height:100%;display:block;fill:currentColor}
.sgp-dl-alt{margin:14px 0 0;font-size:14px;color:#6b7684}
.sgp-dl-alt a{color:#0b8f6a;text-decoration:underline;cursor:pointer}
.sgp-dl-alt span.sgp-sep{opacity:.5;margin:0 8px}
.sgp-dl-help{margin:8px 0 0;font-size:13px;color:#8a97a8}
/* No JavaScript, or an OS we do not recognise: every option is shown as a plain
   list, so the block is never a dead end. */
.sgp-dl.sgp-all .sgp-dl-main{display:none}
.sgp-dl.sgp-all .sgp-dl-alt{font-size:16px;color:#333}
@media (prefers-color-scheme:dark){
  .sgp-dl-alt{color:#9aa7b6}.sgp-dl.sgp-all .sgp-dl-alt{color:#dfe6ee}
  .sgp-dl-alt a{color:#3ddcae}
}
</style>

<script>
(function () {
  /* ---- the three files ------------------------------------------------- */
  var SGP_FILES = {
    win:   'https://streamgraphicspro.com/download/StreamGraphicsProSetup.exe',
    mac:   'https://streamgraphicspro.com/download/StreamGraphics-Pro-mac-AppleSilicon.zip',
    macIntel: 'https://streamgraphicspro.com/download/StreamGraphics-Pro-mac-Intel.zip'
  };

  var WIN_SVG = '<svg viewBox="0 0 24 24"><path d="M3 5.6l7.4-1v7.1H3V5.6zm8.6-1.2L21 3v9.7h-9.4V4.4zM3 12.9h7.4V20L3 18.7v-5.8zm8.6 0H21V21l-9.4-1.3v-6.8z"/></svg>';
  var MAC_SVG = '<svg viewBox="0 0 24 24"><path d="M16.4 12.7c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.9-3-.8-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-1.1 2.8-2.2.9-1.3 1.2-2.5 1.3-2.6-.1 0-2.5-1-2.5-3.5zM14.2 5.3c.6-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.1 1.8-1 2.9 1.1.1 2.2-.6 2.8-1.4z"/></svg>';

  var root = document.getElementById('sgp-downloads');
  var btn  = document.getElementById('sgp-dl-primary');
  var ico  = document.getElementById('sgp-dl-ico');
  var ttl  = document.getElementById('sgp-dl-title');
  var sub  = document.getElementById('sgp-dl-sub');
  var alt  = document.getElementById('sgp-dl-alt');
  var help = document.getElementById('sgp-dl-help');
  if (!root || !btn) return;

  function link(href, text) { return '<a href="' + href + '">' + text + '</a>'; }

  /* ---- which computer is this? ------------------------------------------
     Windows vs Mac is reliable. Which CHIP a Mac has is not: Safari and Chrome
     both report "MacIntel" on an Apple Silicon Mac, so the obvious check is
     wrong on exactly the machines most people now own. The graphics adapter
     name is the one honest signal the browser will give us — an Apple Silicon
     Mac renders through "Apple GPU"/"Apple M…", an Intel one through Intel,
     AMD or Radeon. It is a hint, not proof, which is why the other build stays
     one click away and the "About This Mac" line is always shown. */
  function isMac() {
    var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
    return /mac/i.test(p) || /Mac OS X/i.test(navigator.userAgent);
  }
  function isWindows() {
    var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
    return /win/i.test(p) || /Windows/i.test(navigator.userAgent);
  }
  function looksIntel() {
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl) return false;                       // no signal — assume the common case
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      var r = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '') : '';
      if (!r) return false;
      if (/apple/i.test(r)) return false;          // Apple GPU / Apple M1…M4
      return /intel|radeon|amd|nvidia|geforce/i.test(r);
    } catch (e) { return false; }
  }

  var ABOUT = 'Not sure which Mac you have? Apple menu → About This Mac. ' +
              'A "Chip" line starting with Apple means Apple Silicon; a "Processor" line saying Intel means Intel.';

  if (isWindows()) {
    ico.innerHTML = WIN_SVG;
    ttl.textContent = 'Download for Windows';
    sub.textContent = 'Windows 10 and 11';
    btn.href = SGP_FILES.win;
    alt.innerHTML = 'On a Mac instead? ' +
      link(SGP_FILES.mac, 'Apple Silicon') + '<span class="sgp-sep">|</span>' +
      link(SGP_FILES.macIntel, 'Intel');
    help.textContent = '';
  } else if (isMac()) {
    var intel = looksIntel();
    ico.innerHTML = MAC_SVG;
    ttl.textContent = 'Download for Mac';
    sub.textContent = intel ? 'Intel Macs (2020 and earlier)' : 'Apple Silicon — M1, M2, M3, M4';
    btn.href = intel ? SGP_FILES.macIntel : SGP_FILES.mac;
    alt.innerHTML = (intel
        ? 'Got an Apple Silicon Mac? ' + link(SGP_FILES.mac, 'Download that one instead')
        : 'Got an Intel Mac? ' + link(SGP_FILES.macIntel, 'Download that one instead')) +
      '<span class="sgp-sep">|</span>' + link(SGP_FILES.win, 'Windows');
    help.textContent = ABOUT;
  } else {
    /* Linux, a phone, or anything we cannot place: show everything, plainly.
       Guessing here would be worse than not guessing.
       🚨 The main button is REMOVED, not just hidden. Left in the page it is still a
       real link pointing at "#" — invisible until some rule on your site overrides the
       display:none, and always there for a screen reader to announce. */
    root.className += ' sgp-all';
    var main = root.querySelector('.sgp-dl-main');
    if (main && main.parentNode) main.parentNode.removeChild(main);
    alt.innerHTML = '<b>Download StreamGraphics Pro</b><br>' +
      link(SGP_FILES.win, 'Windows') + '<span class="sgp-sep">|</span>' +
      link(SGP_FILES.mac, 'Mac — Apple Silicon') + '<span class="sgp-sep">|</span>' +
      link(SGP_FILES.macIntel, 'Mac — Intel');
    help.textContent = ABOUT;
  }
})();
</script>
