<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamGraphics — Output</title>
<link rel="stylesheet" href="/output.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312b886'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='bold' fill='%23063' text-anchor='middle'%3EPR%3C/text%3E%3C/svg%3E">
</head>
<body>
  <!-- The stage fills the whole browser-source canvas; background stays transparent. -->
  <div id="stage">
    <div id="timerCard" class="card pos-bottom-center is-out" data-anim="slide-up">
      <!-- .anim carries the enter/exit transform so it never fights the position transform on .card -->
      <div class="anim">
        <div class="label" id="label"></div>
        <div class="time" id="time">00:00</div>
        <div class="accentbar" id="accentbar"></div>
      </div>
    </div>
  </div>
  <script src="/output.js"></script>
</body>
</html>
