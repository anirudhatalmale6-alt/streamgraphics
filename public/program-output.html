<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamGraphics — Program Output</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent !important; overflow: hidden; }
  #stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; }
  .preset { position: absolute; inset: 0; opacity: 0; transition: opacity .45s ease; }
  .preset.in { opacity: 1; }
  .ly { position: absolute; }
  .ly .li { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .ly-text { white-space: pre-wrap; line-height: 1.08; }
  .ly-img { object-fit: contain; } .ly-img.cover { object-fit: cover; } .ly-img.circle { border-radius: 50%; } .ly-img.rounded { border-radius: 16px; }
  body.chroma { background: var(--chroma) !important; }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="/program-output.js"></script>
</body>
</html>
